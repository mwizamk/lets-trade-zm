<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard | Let's Trade ZM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f7f3e8;color:#15162a}.top{background:#10152b;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd6c6;border-radius:16px;padding:17px;margin-bottom:14px}
.service{border-left:4px solid #315f50;padding:13px;margin:10px 0;background:#faf9f4;border-radius:8px}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:.8rem;font-weight:700}.pending{background:#fef08a;color:#713f12}.approved{background:#bbf7d0;color:#14532d}
.creds-box{background:#10152b;color:#b9d889;padding:12px;border-radius:8px;margin-top:8px;font-family:monospace;font-size:.95rem}
</style>
</head>
<body>
<header class="top"><strong>Let's Trade ZM</strong><button id="logoutBtn" style="background:transparent;color:white;border:1px solid #fff5;padding:6px 12px;border-radius:6px">Sign out</button></header>
<main class="wrap">
  <div class="card"><h1 id="welcome">My Dashboard</h1><small id="userMail"></small></div>
  <div class="card"><h2>My Subscriptions</h2><div id="ordersContainer">Loading subscriptions...</div></div>
  <div class="card" style="background:#193b35;color:white">
    <h2>Payment Info</h2>
    <p>Airtel Money: <strong>0979276543</strong> (Mwiza Kondowe)</p>
  </div>
</main>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const ordersContainer = document.getElementById("ordersContainer");

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "login.html"; return; }

    document.getElementById("welcome").textContent = "Welcome back!";
    document.getElementById("userMail").textContent = user.email;

    const q = query(collection(db, "orders"), where("email", "==", user.email));
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        ordersContainer.innerHTML = "<p>No active orders found.</p>";
        return;
      }

      ordersContainer.innerHTML = "";
      snapshot.forEach(docSnap => {
        const o = docSnap.data();
        const isApproved = o.status === "Approved";

        ordersContainer.innerHTML += `
          <div class="service">
            <div style="display:flex;justify-content:space-between">
              <strong>${o.orderId}</strong>
              <span class="badge ${isApproved ? 'approved' : 'pending'}">${o.status}</span>
            </div>
            <p><strong>Services:</strong> ${o.services.map(s => s.name).join(", ")}<br>
            <strong>Total:</strong> K${o.total}</p>

            ${isApproved ? `
              <div class="creds-box">
                <strong>🔑 Account Access Details:</strong><br>
                ${o.assignedCredentials || 'Credentials pending assignment.'}
              </div>
            ` : `
              <p style="font-size:.85rem;color:#666"><em>Account details will be unlocked here once your Mobile Money payment is confirmed by Admin.</em></p>
            `}
          </div>
        `;
      });
    });
  });

  document.getElementById("logoutBtn").onclick = () => signOut(auth);
</script>
</body>
</html>
