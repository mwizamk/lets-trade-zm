<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Payment | Let's Trade ZM
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<header class="navbar">

<a
  href="index.html"
  class="logo"
>
<span>Let's</span> Trade ZM
</a>

<a
  href="pricelist.html"
  class="nav-link"
>
PriceList
</a>

</header>


<main class="wrap">

<h1>
Payment
</h1>

<p>
Complete your payment for this order.
</p>


<div id="orderSummary">

Loading order...

</div>


<section class="card">

<h2>
Payment details
</h2>


<form id="paymentForm">


<label for="paymentMethod">
Payment method
</label>


<select
  id="paymentMethod"
  required
>

<option value="">
Select payment method
</option>

<option value="airtel_money">
Airtel Money
</option>

<option value="mtn_money">
MTN Money
</option>

<option value="zamtel_money">
Zamtel Money
</option>

<option value="bank_transfer">
Bank Transfer
</option>

</select>


<label for="reference">
Transaction / reference number
</label>


<input
  id="reference"
  type="text"
  placeholder="Enter transaction number"
  required
>


<label for="amount">
Amount paid
</label>


<input
  id="amount"
  type="number"
  min="0"
  step="0.01"
  placeholder="Enter amount"
  required
>


<button
  id="submitPayment"
  type="submit"
>
Submit Payment
</button>


<p id="message"></p>


</form>

</section>


<section class="card">

<h3>
After submitting
</h3>

<p>
Your payment will remain
<strong>pending</strong>
until an administrator verifies it.
</p>

<p>
Admin:
<strong>
0979276543
</strong>
</p>

</section>


</main>


<script
  type="module"
  src="payment.js"
></script>

</body>

</html>
