<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Trade ZM | Subscriptions & Digital Services</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f7f3e8;color:#15162a}
.wrap{max-width:900px;margin:auto;padding:20px}
.head{background:#10152b;color:white;padding:28px;border-radius:18px;margin-bottom:20px;text-align:center}
.head h1{margin:0 0 6px 0;color:#b9d889}
.filter-btn{background:#e8e2d2;border:1px solid #cfc9bb;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer;color:#10152b}
.filter-btn.active{background:#193b35;color:white;border-color:#193b35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:white;border:1px solid #ddd6c6;padding:18px;border-radius:16px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.badge{font-size:.75rem;padding:4px 8px;background:#10152b;color:#b9d889;border-radius:6px;font-weight:700;position:absolute;top:16px;right:16px}
.btn{display:block;text-align:center;background:#193b35;color:white;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Let's Trade ZM</h1>
    <p>Premium Digital Subscriptions & Services at Affordable Rates</p>
  </header>

  <section>
    <h2>Services & Catalog</h2>
    
    <!-- Ownership Filter Tabs -->
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button class="filter-btn active" id="btn-All" onclick="filterCatalog('All')">All</button>
      <button class="filter-btn" id="btn-Shared" onclick="filterCatalog('Shared')">Shared</button>
      <button class="filter-btn" id="btn-Private" onclick="filterCatalog('Private')">Private</button>
    </div>

    <div id="catalogContainer" class="grid">
      <p>Loading active price list...</p>
    </div>
  </section>
</div>

<script type="module">
  import { db, collection, onSnapshot } from "./firebase.js";

  let allServices = [];
  let currentFilter = "All";

  onSnapshot(collection(db, "services"), (snapshot) => {
    allServices = [];
    snapshot.forEach(docSnap => {
      allServices.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderCatalog(currentFilter);
  });

  window.filterCatalog = (ownership) => {
    currentFilter = ownership;
    document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.getElementById("btn-" + ownership);
    if (activeBtn) activeBtn.classList.add("active");
    renderCatalog(ownership);
  };

  function renderCatalog(ownership) {
    const container = document.getElementById("catalogContainer");
    const filtered = ownership === "All" 
      ? allServices 
      : allServices.filter(s => (s.ownership || "").toLowerCase() === ownership.toLowerCase());

    if (!filtered.length) {
      container.innerHTML = "<p>No services available under this filter currently.</p>";
      return;
    }

    container.innerHTML = filtered.map(s => `
      <div class="card">
        <div>
          <span class="badge">${s.ownership || 'Shared'}</span>
          <h3 style="margin:0 0 6px 0;padding-right:60px">${s.name}</h3>
          <p style="font-size:1.4rem;font-weight:900;color:#193b35;margin:0 0 8px 0">K${s.price}</p>
          <p style="font-size:.85rem;color:#555;margin:0">${s.description || ''}</p>
        </div>
        <a href="signup.html" class="btn">Order Service</a>
      </div>
    `).join("");
  }
</script>
</body>
</html>
