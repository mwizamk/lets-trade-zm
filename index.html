<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal - Authentication</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <div class="brand">
      <div class="brand-icon">&#128274;</div>
      <h1>Client Portal</h1>
      <p>Sign in to your account or create a new one</p>
    </div>

    <div class="card">
      <!-- Toggle Tabs -->
      <div class="tab-group" role="tablist">
        <button type="button" class="tab-btn active" id="tab-login" role="tab" aria-selected="true">Sign In</button>
        <button type="button" class="tab-btn" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <!-- Error / Success Banner -->
      <div id="feedback-banner" class="banner" role="alert">
        <span id="banner-message"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="input-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <!-- Sign Up Form (Hidden by default) -->
      <form id="signup-form" class="hidden">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="input-control" placeholder="Jane Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="input-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="signup-password">Password (min 6 characters)</label>
          <input type="password" id="signup-password" class="input-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="input-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" id="signup-submit-btn" class="btn btn-primary">
          <span class="btn-text">Create Account</span>
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
