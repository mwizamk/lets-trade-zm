<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Let's Trade ZM</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10152b;font-family:system-ui,sans-serif;padding:18px}
.box{width:min(420px,100%);background:#fff;padding:26px;border-radius:20px}
.brand{font-size:1.5rem;font-weight:900;color:#193b35}
label{display:block;font-weight:700;margin-top:18px}
input{width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:10px;font:inherit}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;background:#193b35;color:#fff;font-weight:800;cursor:pointer}
.msg{margin-top:12px;color:#a11;font-size:0.9rem;word-break:break-word}
</style>
</head>
<body>
<main class="box">
  <div class="brand">Let's Trade ZM</div>
  <p>Administrator Portal</p>
  <form id="form">
    <label>Admin Email
      <input id="user" type="email" required placeholder="admin@domain.com">
    </label>
    <label>Password
      <input id="pass" type="password" required placeholder="••••••••">
    </label>
    <button type="submit">Sign In</button>
    <div id="msg" class="msg"></div>
  </form>
</main>

<script type="module">
  import { auth } from "./firebase-config.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "Authenticating...";
    
    const email = document.getElementById("user").value;
    const password = document.getElementById("pass").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "admin.html";
    } catch (error) {
      msg.textContent = "Login failed: " + error.message;
    }
  });
</script>
</body>
</html>
