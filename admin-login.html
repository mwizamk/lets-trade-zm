<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Let's Trade ZM</title><meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10152b;font-family:system-ui,sans-serif;padding:18px}.box{width:min(420px,100%);background:#fff;padding:26px;border-radius:20px}.brand{font-size:1.5rem;font-weight:900;color:#193b35}label{display:block;font-weight:700;margin-top:18px}input{width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:10px;font:inherit}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;background:#193b35;color:#fff;font-weight:800}.msg{margin-top:12px;color:#a11}
</style></head>
<body><main class="box"><div class="brand">Let's Trade ZM</div><p>Administrator Portal</p>
<form id="form"><label>Admin username<input id="user" required></label><label>Password<input id="pass" type="password" required></label><button>Sign In</button><div id="msg" class="msg"></div></form>
<p style="font-size:.8rem;color:#777">Prototype only. Never put real admin credentials in frontend JavaScript.</p></main>
<script>
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();localStorage.setItem("ltzm_admin","true");location.href="admin.html"});
</script></body></html>
