<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal | Let's Trade ZM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#10152b;color:#f7f3e8;padding:16px}.card{background:#19223c;border-radius:12px;padding:16px;margin-bottom:14px}input,textarea,select{width:100%;padding:8px;margin-top:6px;background:#0f172a;color:white;border:1px solid #334155;border-radius:6px}button{background:#b9d889;color:#10152b;font-weight:800;border:0;padding:10px;border-radius:6px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<h1>Let's Trade ZM — Admin</h1>

<div class="card">
  <h2>1. Add Inventory Account</h2>
  <form id="addAccountForm">
    <label>Service Name <input id="accService" placeholder="e.g. Netflix Premium" required></label>
    <label>Credentials / Details <textarea id="accDetails" placeholder="Email | Password | PIN" required></textarea></label>
    <button type="submit">Save Account to Inventory</button>
  </form>
</div>

<div class="card">
  <h2>2. Customer Orders</h2>
  <div id="ordersList">Loading...</div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { collection, onSnapshot, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Inventory submission
  document.getElementById("addAccountForm").onsubmit = async (e) => {
    e.preventDefault();
    await addDoc(collection(db, "accounts"), {
      serviceName: document.getElementById("accService").value,
      credentials: document.getElementById("accDetails").value,
      isAssigned: false,
      createdAt: new Date().toISOString()
    });
    alert("Account added!");
    e.target.reset();
  };

  // Listen to Customer Orders
  onSnapshot(collection(db, "orders"), (snapshot) => {
    const container = document.getElementById("ordersList");
    container.innerHTML = "";
    snapshot.forEach((orderDoc) => {
      const o = orderDoc.data();
      const id = orderDoc.id;

      container.innerHTML += `
        <div style="background:#10152b;padding:12px;margin-bottom:10px;border-radius:8px">
          <strong>${o.orderId} — ${o.name} (${o.number})</strong><br>
          <small>Status: ${o.status} | Total: K${o.total}</small><br>
          <small>Services: ${o.services.map(s => s.name).join(", ")}</small>
          
          <textarea id="creds-${id}" placeholder="Enter or paste account logins">${o.assignedCredentials || ''}</textarea>
          <button onclick="window.approveOrder('${id}')">Confirm Payment & Assign Access</button>
        </div>
      `;
    });
  });

  window.approveOrder = async (id) => {
    const creds = document.getElementById(`creds-${id}`).value;
    await updateDoc(doc(db, "orders", id), {
      status: "Approved",
      assignedCredentials: creds
    });
    alert("Order Approved & Login Details Sent to Customer Dashboard!");
  };
</script>
</body>
</html>
