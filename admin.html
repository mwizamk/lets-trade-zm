<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Admin | Let's Trade ZM
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<header class="navbar">

<a
  href="index.html"
  class="logo"
>
<span>Let's</span> Trade ZM
</a>

<a
  href="index.html"
  class="nav-link"
>
Customer Site
</a>

</header>


<main class="wrap">

<h1>
Admin Portal
</h1>

<p>
Let's Trade ZM management system.
</p>


<!-- PRICE LIST -->

<section class="admin-card">

<h2>
💰 PriceList
</h2>


<form id="priceForm">

<input
  type="hidden"
  id="priceId"
>


<label>
Service
</label>

<input
  id="service"
  placeholder="Netflix"
  required
>


<label>
Package
</label>

<input
  id="packageName"
  placeholder="Premium"
  required
>


<label>
Ownership
</label>

<select
  id="ownership"
>

<option value="shared">
Shared
</option>

<option value="private">
Private
</option>

</select>


<label>
Price (ZMW)
</label>

<input
  id="price"
  type="number"
  min="0"
  step="0.01"
  required
>


<label>
Duration (days)
</label>

<input
  id="durationDays"
  type="number"
  min="1"
  value="30"
  required
>


<label>
Description
</label>

<textarea
  id="description"
></textarea>


<label>
Status
</label>

<select
  id="priceStatus"
>

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>


<button
  type="submit"
>
Save Service
</button>


</form>


<div id="adminPrices">

Loading...

</div>

</section>


<!-- ORDERS -->

<section class="admin-card">

<h2>
🛒 Orders
</h2>

<div id="adminOrders">

Loading...

</div>

</section>


<!-- PAYMENTS -->

<section class="admin-card">

<h2>
💳 Payments
</h2>

<div id="adminPayments">

Loading...

</div>

</section>


<!-- CLIENTS -->

<section class="admin-card">

<h2>
👥 Customers
</h2>

<div id="adminClients">

Loading...

</div>

</section>


</main>


<script
  type="module"
  src="admin.js"
></script>

</body>

</html>
