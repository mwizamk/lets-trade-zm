<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal | Let's Trade ZM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc}.wrap{max-width:950px;margin:auto;padding:20px}
.card{background:#1e293b;border:1px solid #334155;padding:20px;border-radius:16px;margin-bottom:20px}
input,select{width:100%;padding:10px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:white;font:inherit;margin-top:4px}
button{cursor:pointer;font-weight:700;border:0;border-radius:8px}
.item-row{background:#0f172a;padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin Control Panel</h1>

  <!-- PRICE CATALOG MANAGER -->
  <div class="card">
    <h2 style="margin-top:0">Manage Price Catalog</h2>
    
    <form id="serviceForm" style="display:grid;gap:12px;margin-bottom:20px">
      <input type="hidden" id="serviceDocId">
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label>Service Name <input id="srvName" placeholder="e.g. Netflix Premium" required></label>
        <label>Price (ZMW) <input id="srvPrice" type="number" placeholder="65" required></label>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label>Ownership Type
          <select id="srvOwnership" required>
            <option value="Shared">Shared</option>
            <option value="Private">Private</option>
          </select>
        </label>
        <label>Description <input id="srvDesc" placeholder="e.g. 1 Shared Profile | 4K Ultra HD"></label>
      </div>

      <div style="display:flex;gap:10px">
        <button type="submit" id="saveSrvBtn" style="background:#b9d889;color:#0f172a;padding:12px;flex:1">Save Service</button>
        <button type="button" id="cancelEditBtn" style="display:none;background:#64748b;color:white;padding:12px" onclick="resetForm()">Cancel Edit</button>
      </div>
    </form>

    <h3>Active Services Catalog</h3>
    <div id="adminServicesList">Loading catalog...</div>
  </div>
</div>

<script type="module">
  import { db, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "./firebase.js";

  const form = document.getElementById("serviceForm");
  const list = document.getElementById("adminServicesList");

  // Real-time catalog view
  onSnapshot(collection(db, "services"), (snapshot) => {
    if (snapshot.empty) {
      list.innerHTML = "<p>No services found in database. Add one above.</p>";
      return;
    }

    list.innerHTML = "";
    snapshot.forEach(docSnap => {
      const s = docSnap.data();
      const id = docSnap.id;

      list.innerHTML += `
        <div class="item-row">
          <div>
            <strong>${s.name}</strong> — <span style="color:#b9d889">K${s.price}</span> 
            <small style="background:#334155;padding:2px 6px;border-radius:4px;margin-left:6px">${s.ownership || 'Shared'}</small>
            <div style="font-size:.8rem;color:#94a3b8">${s.description || ''}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button onclick="window.editService('${id}', \`${s.name}\`, ${s.price}, '${s.ownership || 'Shared'}', \`${s.description || ''}\`)" style="background:#38bdf8;color:#0f172a;padding:6px 12px">Edit</button>
            <button onclick="window.deleteService('${id}')" style="background:#ef4444;color:white;padding:6px 12px">Delete</button>
          </div>
        </div>
      `;
    });
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const docId = document.getElementById("serviceDocId").value;
    const data = {
      name: document.getElementById("srvName").value,
      price: Number(document.getElementById("srvPrice").value),
      ownership: document.getElementById("srvOwnership").value,
      description: document.getElementById("srvDesc").value,
      updatedAt: new Date().toISOString()
    };

    try {
      if (docId) {
        await updateDoc(doc(db, "services", docId), data);
        alert("Service updated successfully!");
      } else {
        await addDoc(collection(db, "services"), data);
        alert("New service added to catalog!");
      }
      resetForm();
    } catch (err) {
      alert("Error saving service: " + err.message);
    }
  };

  window.editService = (id, name, price, ownership, desc) => {
    document.getElementById("serviceDocId").value = id;
    document.getElementById("srvName").value = name;
    document.getElementById("srvPrice").value = price;
    document.getElementById("srvOwnership").value = ownership;
    document.getElementById("srvDesc").value = desc;
    document.getElementById("saveSrvBtn").textContent = "Update Service";
    document.getElementById("cancelEditBtn").style.display = "inline-block";
  };

  window.deleteService = async (id) => {
    if (confirm("Are you sure you want to delete this service from the catalog?")) {
      try {
        await deleteDoc(doc(db, "services", id));
      } catch (err) {
        alert("Error deleting service: " + err.message);
      }
    }
  };

  window.resetForm = () => {
    form.reset();
    document.getElementById("serviceDocId").value = "";
    document.getElementById("saveSrvBtn").textContent = "Save Service";
    document.getElementById("cancelEditBtn").style.display = "none";
  };
</script>
</body>
</html>
